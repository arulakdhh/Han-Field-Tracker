<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dr. Han Field Sales – Visit Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
:root{
  --navy:#0e2a47; --navy2:#16395f; --green:#1f9d6f; --green-soft:#e6f5ee; --red:#d64545; --red-soft:#fbeaea;
  --amber:#c9850b; --amber-soft:#fdf3df; --ink:#14212e; --muted:#5f6f80; --line:#e3e8ee; --bg:#f4f6f9; --card:#fff;
  --r:12px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--navy);color:#fff;padding:14px 18px 0}
.brand{display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto}
.brand img{width:38px;height:36px;background:#fff;border-radius:8px;padding:3px}
.brand h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
.brand small{display:block;color:#8fd6b7;font-size:12px;font-weight:500}
.brand .sp{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:#cfe0ef}
.who select{background:var(--navy2);border:1px solid #2d5580;color:#fff;border-radius:8px;padding:7px 10px;max-width:190px}
.who{flex-wrap:wrap;justify-content:flex-end}
.hb{background:transparent;border:1px solid #2d5580;color:#fff;border-radius:8px;padding:6px 9px;font-size:12.5px;cursor:pointer;font-weight:600}
.idc{background:var(--navy2);border-radius:6px;padding:2px 7px;font-family:"JetBrains Mono",monospace;font-size:11.5px;color:#cfe0ef}
.adm{background:var(--green);color:#fff;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:700}
.login{max-width:390px;margin:28px auto;padding:26px 24px}
.login .lg-i{width:52px;height:50px}
.login h3{margin:10px 0 2px;font-size:21px;color:var(--navy)}
.login label.f{display:block;font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.login .btn{width:100%;justify-content:center;margin-top:18px;padding:11px}
.hello{margin-top:8px;font-weight:600;color:var(--green);min-height:1.3em}
nav{display:flex;gap:2px;max-width:1100px;margin:12px auto 0;overflow-x:auto;scrollbar-width:none}
nav a{color:#b9cbdd;text-decoration:none;padding:10px 14px;font-size:14px;font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
nav a.on{color:#fff;border-color:var(--green)}
nav a .n{background:var(--green);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;margin-left:5px}
main{max-width:1100px;margin:0 auto;padding:18px 14px 80px}
.notice{background:var(--amber-soft);border:1px solid #f0d9a7;color:#6e4b07;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.notice.info{background:#eaf2fb;border-color:#c9dcf1;color:#1d4670}
h2{font-size:13px;letter-spacing:2.2px;text-transform:uppercase;color:var(--green);margin:6px 0 12px;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
input[type=text],input[type=search],input[type=date],input[type=tel],input[type=password],select,textarea{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 11px;width:100%}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #9fd9c0;border-color:var(--green)}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-size:14px}
.btn:hover{border-color:#c5ced8}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.pri:hover{background:#198660}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.wa{background:#25d366;border-color:#25d366;color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.doc{cursor:pointer;transition:border-color .15s, box-shadow .15s}
.doc:hover{border-color:#9fd9c0;box-shadow:0 2px 10px rgba(14,42,71,.06)}
.doc .t{font-weight:700;font-size:15.5px}
.doc .h{color:var(--muted);font-size:13.5px;margin-top:2px}
.doc .m{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center;font-size:12.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600;background:#eef1f5;color:#3b4a5a;white-space:nowrap}
.chip.pos{background:var(--green-soft);color:#13704e}
.chip.fu{background:var(--amber-soft);color:#8a5a00}
.chip.neg{background:var(--red-soft);color:#a12d2d}
.chip.role{background:#eaf2fb;color:#1d4670}
.chip.due{background:var(--navy);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:24px;font-weight:700;color:var(--navy)}
.stat span{font-size:12.5px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 16px;background:#fff;border:1px dashed var(--line);border-radius:var(--r)}
/* sheet / modal */
.overlay{position:fixed;inset:0;background:rgba(10,25,40,.45);display:none;z-index:20;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px 10px}
.overlay.on{display:flex}
.sheet{background:#fff;border-radius:16px;max-width:720px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.25);overflow:hidden}
.sheet-h{background:var(--navy);color:#fff;padding:14px 18px;display:flex;align-items:flex-start;gap:10px}
.sheet-h .x{margin-left:auto;background:none;border:0;color:#fff;font-size:22px;cursor:pointer;line-height:1}
.sheet-b{padding:16px 18px 20px}
.auto{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;background:#f6f9fb;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:16px}
.auto div{font-size:12px;color:var(--muted)}
.auto b{display:block;color:var(--ink);font-size:14px;font-weight:600}
.lbl{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin:16px 0 7px;display:block}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:22px;padding:7px 13px;font-size:13.5px;font-weight:600;cursor:pointer}
.seg button.on{border-color:var(--navy);background:var(--navy);color:#fff}
.status3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.status3 button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 6px;font-weight:700;cursor:pointer;font-size:14.5px}
.status3 button.pos.on{border-color:var(--green);background:var(--green-soft);color:#13704e}
.status3 button.fu.on{border-color:var(--amber);background:var(--amber-soft);color:#8a5a00}
.status3 button.neg.on{border-color:var(--red);background:var(--red-soft);color:#a12d2d}
.cond{margin-top:12px;padding:12px;border-radius:10px;background:#f6f9fb;border:1px solid var(--line)}
.hist{border-left:3px solid var(--line);padding-left:12px;margin-top:6px}
.hist .it{margin-bottom:12px;font-size:13.5px}
.hist .it .d{color:var(--muted);font-size:12.5px}
.err{color:var(--red);font-size:13px;margin-top:8px;min-height:1em}
table{width:100%;border-collapse:collapse;background:#fff;font-size:13.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);background:#f6f9fb;position:sticky;top:0}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:var(--r);max-height:560px}
.msg{white-space:pre-wrap;background:#e7fbe9;border:1px solid #c6eccb;border-radius:10px;padding:12px;font-size:13.5px;margin:10px 0}
.kp{background:#fffbea;border:1px solid #f1e3a6;border-radius:10px;padding:10px 12px;font-size:13.5px}
.mono{font-family:"JetBrains Mono",monospace;font-size:12.5px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:24px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
.toast.on{opacity:1}
.muted{color:var(--muted)}
.small{font-size:12.5px}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
@media (max-width:640px){
  .brand h1{font-size:15px}.who label span{display:none}.who select{max-width:150px}.brand small{display:none}#meBox b{display:none}
  .status3 button{font-size:13px}
}
/* ================= THEMES ================= */
:root{--accent:#1f9d6f;--accent2:#14b8a6;--hdr:linear-gradient(120deg,#0e2a47,#16395f 45%,#145a5c 100%);--hsub:#8fd6b7;--navlink:#b9cbdd;--bgimg:none;--cardbg:#fff;--glass:none;--shadow:0 1px 2px rgba(14,42,71,.04)}
body[data-theme="ocean"]{--navy:#0b3d6e;--navy2:#0f5584;--accent:#0ea5a4;--accent2:#38bdf8;--hdr:linear-gradient(120deg,#0b3d6e,#0e7490 40%,#0ea5a4 75%,#0b3d6e);--hsub:#a5f3fc;--navlink:#cfeaf5;--bg:#eaf6fb;--bgimg:radial-gradient(1200px 500px at 10% -10%,#bae6fd 0,transparent 60%),radial-gradient(900px 500px at 110% 10%,#a7f3d0 0,transparent 55%);--cardbg:rgba(255,255,255,.72);--glass:blur(10px);--line:#d4e8f1;--shadow:0 6px 24px rgba(14,116,144,.08)}
body[data-theme="sunrise"]{--navy:#7c2d12;--navy2:#9a3412;--accent:#ea580c;--accent2:#f59e0b;--hdr:linear-gradient(120deg,#7f1d1d,#c2410c 40%,#f59e0b 80%,#7f1d1d);--hsub:#fde68a;--navlink:#ffe4cc;--bg:#fff7f0;--bgimg:radial-gradient(1000px 420px at 100% -10%,#fed7aa 0,transparent 60%),radial-gradient(800px 400px at -10% 20%,#fecdd3 0,transparent 55%);--cardbg:#fff;--line:#f5e1d3;--shadow:0 6px 20px rgba(194,65,12,.07)}
body[data-theme="royal"]{--navy:#2e1065;--navy2:#4c1d95;--accent:#7c3aed;--accent2:#ec4899;--hdr:linear-gradient(120deg,#1e1b4b,#4c1d95 40%,#7c3aed 75%,#1e1b4b);--hsub:#e9d5ff;--navlink:#ddd6fe;--bg:#f6f3ff;--bgimg:radial-gradient(1000px 420px at 0% -10%,#ddd6fe 0,transparent 60%),radial-gradient(800px 420px at 110% 0%,#fbcfe8 0,transparent 55%);--cardbg:rgba(255,255,255,.85);--glass:blur(8px);--line:#e7e0fb;--shadow:0 6px 22px rgba(76,29,149,.08)}
body[data-theme="midnight"]{--navy:#e2e8f0;--navy2:#1e293b;--accent:#22c55e;--accent2:#06b6d4;--hdr:linear-gradient(120deg,#020617,#0f172a 45%,#083344 80%,#020617);--hsub:#67e8f9;--navlink:#94a3b8;--ink:#e2e8f0;--muted:#94a3b8;--bg:#0b1120;--bgimg:radial-gradient(900px 400px at 100% -10%,rgba(6,182,212,.18) 0,transparent 60%),radial-gradient(800px 400px at -10% 30%,rgba(34,197,94,.12) 0,transparent 55%);--cardbg:rgba(17,24,39,.85);--line:#1f2a3c;--shadow:0 6px 24px rgba(0,0,0,.35);--green-soft:rgba(34,197,94,.15);--amber-soft:rgba(234,179,8,.15);--red-soft:rgba(239,68,68,.15)}
body{background:var(--bgimg),var(--bg);background-attachment:fixed;transition:background-color .4s}
header{background:var(--hdr);background-size:300% 300%;animation:gradMove 18s ease infinite;position:relative;overflow:hidden}
header::after{content:"";position:absolute;inset:0;background:radial-gradient(400px 120px at 85% 0%,rgba(255,255,255,.14),transparent 70%);pointer-events:none}
.brand small{color:var(--hsub)}
.brand img{transition:transform .5s cubic-bezier(.2,.9,.3,1.4)}.brand:hover img{transform:rotate(-8deg) scale(1.06)}
nav a{color:var(--navlink);border-bottom:0;position:relative;transition:color .2s}
nav a::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:linear-gradient(90deg,var(--accent),var(--accent2));transform:scaleX(0);transition:transform .3s cubic-bezier(.2,.9,.3,1.2)}
nav a.on{color:#fff}nav a.on::after,nav a:hover::after{transform:scaleX(1)}
nav a .n{background:var(--accent);animation:pulse 2s infinite}
h2,.hello{color:var(--accent)}
.adm{background:linear-gradient(120deg,var(--accent),var(--accent2))}
.btn.pri{background:linear-gradient(120deg,var(--accent),var(--accent2));border-color:transparent;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn.pri:hover{filter:brightness(1.06);background:linear-gradient(120deg,var(--accent),var(--accent2))}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent);border-color:var(--accent)}
.card,.stat,.empty,.tbl,.sheet{background:var(--cardbg);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border-color:var(--line);box-shadow:var(--shadow)}
.stat b{background:linear-gradient(120deg,var(--navy),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.toast{background:linear-gradient(120deg,var(--navy2),var(--accent));transform:translate(-50%,20px);transition:opacity .25s,transform .35s cubic-bezier(.2,.9,.3,1.3)}
.toast.on{transform:translate(-50%,0)}
/* dark theme fixes */
body[data-theme="midnight"] input,body[data-theme="midnight"] select,body[data-theme="midnight"] textarea,body[data-theme="midnight"] .btn,body[data-theme="midnight"] .seg button,body[data-theme="midnight"] .status3 button{background:#111827;color:var(--ink);border-color:#263247}
body[data-theme="midnight"] .btn.pri{color:#04130a}
body[data-theme="midnight"] .seg button.on{background:var(--accent);color:#04130a;border-color:var(--accent)}
body[data-theme="midnight"] th,body[data-theme="midnight"] .auto,body[data-theme="midnight"] .cond,body[data-theme="midnight"] table{background:#0f172a;border-color:#263247}
body[data-theme="midnight"] td{border-color:#1f2a3c}
body[data-theme="midnight"] .chip{background:#1e293b;color:#cbd5e1}
body[data-theme="midnight"] .chip.pos{color:#4ade80}body[data-theme="midnight"] .chip.fu{color:#facc15}body[data-theme="midnight"] .chip.neg{color:#f87171}body[data-theme="midnight"] .chip.role{background:#172554;color:#93c5fd}
body[data-theme="midnight"] .notice{background:#1c1a0f;border-color:#3f3714;color:#fde68a}body[data-theme="midnight"] .notice.info{background:#0c1a2e;border-color:#1e3a5f;color:#bfdbfe}
body[data-theme="midnight"] .msg{background:#052e1a;border-color:#14532d;color:#d1fae5}body[data-theme="midnight"] .kp{background:#1c1a0f}
body[data-theme="midnight"] .sheet-h{background:#020617}
body[data-theme="midnight"] a{color:#7dd3fc}
body[data-theme="midnight"] .stat b{background:linear-gradient(120deg,#e2e8f0,var(--accent));-webkit-background-clip:text;background-clip:text}

/* ================= ANIMATIONS ================= */
@keyframes gradMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes popIn{0%{opacity:0;transform:scale(.92)}70%{transform:scale(1.02)}100%{opacity:1;transform:scale(1)}}
@keyframes sheetIn{from{opacity:0;transform:translateY(40px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}50%{box-shadow:0 0 0 6px transparent}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes glow{0%,100%{box-shadow:0 10px 40px color-mix(in srgb,var(--accent) 18%,transparent)}50%{box-shadow:0 14px 50px color-mix(in srgb,var(--accent2) 30%,transparent)}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
@keyframes ripple{to{transform:scale(4);opacity:0}}
@keyframes bounceSel{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
main.anim>*{animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) both}
main.anim>*:nth-child(2){animation-delay:.05s}main.anim>*:nth-child(3){animation-delay:.1s}main.anim>*:nth-child(4){animation-delay:.15s}main.anim>*:nth-child(5){animation-delay:.2s}main.anim>*:nth-child(n+6){animation-delay:.25s}
main.anim .stat{animation:popIn .55s cubic-bezier(.2,.9,.3,1.2) both}
main.anim .stat:nth-child(2){animation-delay:.06s}main.anim .stat:nth-child(3){animation-delay:.12s}main.anim .stat:nth-child(4){animation-delay:.18s}main.anim .stat:nth-child(5){animation-delay:.24s}
main.anim .grid>*{animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) both}
main.anim .grid>*:nth-child(1){animation-delay:.12s}main.anim .grid>*:nth-child(2){animation-delay:.17s}main.anim .grid>*:nth-child(3){animation-delay:.22s}main.anim .grid>*:nth-child(4){animation-delay:.27s}main.anim .grid>*:nth-child(5){animation-delay:.32s}main.anim .grid>*:nth-child(6){animation-delay:.37s}main.anim .grid>*:nth-child(7){animation-delay:.42s}main.anim .grid>*:nth-child(8){animation-delay:.47s}main.anim .grid>*:nth-child(n+9){animation-delay:.5s}
main.anim tbody tr{animation:fadeIn .4s both}
.stat,.doc,.card{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s}
.stat:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(14,42,71,.10)}
.doc:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(14,42,71,.12);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.doc:active{transform:translateY(-1px) scale(.99)}
.btn{position:relative;overflow:hidden;transition:transform .12s,filter .2s,box-shadow .2s}
.btn:active{transform:scale(.96)}
.btn .rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);width:40px;height:40px;margin:-20px 0 0 -20px;pointer-events:none;transform:scale(0);animation:ripple .55s ease-out}
.overlay.on{animation:fadeIn .2s both;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.overlay.on .sheet{animation:sheetIn .38s cubic-bezier(.2,.9,.3,1.15) both}
.seg button,.status3 button{transition:all .2s}
.seg button.on,.status3 button.on{animation:bounceSel .3s}
.chip.due{animation:pulse 2.2s infinite}
.empty{animation:fadeIn .4s both}
.login{animation:popIn .6s cubic-bezier(.2,.9,.3,1.2) both, glow 5s ease-in-out infinite;border:1px solid color-mix(in srgb,var(--accent) 25%,var(--line));position:relative}
.login .lg-i{animation:floaty 3.5s ease-in-out infinite}
.login .btn.pri{background-size:200% 100%;animation:gradMove 6s ease infinite}
.skel{height:92px;border-radius:12px;background:linear-gradient(90deg,var(--line) 0,color-mix(in srgb,var(--line) 40%,#fff) 50%,var(--line) 100%);background-size:800px 100%;animation:shimmer 1.2s linear infinite}
/* theme picker */
.th-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.th{border:2px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;background:#fff;transition:transform .2s,border-color .2s;text-align:left;padding:0}
.th:hover{transform:translateY(-3px)}.th.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.th .sw{height:64px;position:relative}.th .sw i{position:absolute;bottom:8px;left:10px;width:46px;height:18px;border-radius:9px}.th .sw u{position:absolute;bottom:8px;left:62px;width:26px;height:18px;border-radius:9px;background:#fff;opacity:.85}

<script>
/* ---------- constants ---------- */
const PURPOSES = ["Product Introduction","Product Demo","Price / Quotation Discussion","Sample / Trial Delivery","Order Follow-up","Order Confirmation","Payment Collection","Service / Complaint","Relationship Visit","Tender / Documentation","Other"];
const ROLES = {purchase:"Purchase", nopurchase:"No Purchase", referral:"Referral Only"};
const ROLE_LONG = {purchase:"Purchase committee member", nopurchase:"Not involved in purchase", referral:"Referral only (influencer)"};
const STATUS = {positive:"Positive", followup:"Follow-up", negative:"Negative"};
const SCLS = {positive:"pos", followup:"fu", negative:"neg"};

/* ---------- state ---------- */
let db=null, user=null, downloads=null, sample=null;
let master={executives:[]}, masterLoaded=false, visits=[], visitsLoaded=false;
let canWrite=true, canAdmin=false, offlineNote="";
let me = (()=>{try{return localStorage.getItem("han_exec")||""}catch(e){return ""}})();
let view = "visits";
let filt = {oExec:"all", oStage:"all", oPeriod:"all", zone:"all", acFrom:today(), acTo:today(), acExec:"all", acType:"all", q:"", dExec:"all", dSt:"all", fuExec:"all", fuWhen:"all", brDate:addDays(today(),1), rpExec:"all", rpStatus:"all", rpFrom:"", rpTo:""};

/* ---------- helpers ---------- */
const $ = s=>document.querySelector(s);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function pad(n){return String(n).padStart(2,"0")}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){return ymd(new Date())}
function addDays(s,n){const [y,m,d]=s.split("-").map(Number);const x=new Date(y,m-1,d+n);return ymd(x)}
function nowTime(){const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())}
function fmtD(s){if(!s)return "";const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("en-IN",{weekday:"short",day:"2-digit",month:"short",year:"numeric"})}
function fmtDs(s){if(!s)return "";const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("en-IN",{day:"2-digit",month:"short"})}
function t12(t){if(!t)return "";let [h,m]=t.split(":").map(Number);const ap=h>=12?"PM":"AM";h=h%12||12;return h+":"+pad(m)+" "+ap}
function slug(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"x"}
function phone(p){let d=String(p||"").replace(/\D/g,"");if(d.length===10)d="91"+d;if(d.length===11&&d[0]==="0")d="91"+d.slice(1);return d}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>e.classList.remove("on"),2200)}
function execById(id){return master.executives.find(e=>e.id===id)}
function nextDate(v){return v.status==="positive"?v.expectedDate:v.status==="followup"?v.nextDate:""}
function key(execId,docId){return docId}

/* derived: visits per doctor, sorted oldest→newest */
function byDoctor(){
  const m={};
  for(const v of visits){(m[key(v.execId,v.doctorId)] ||= []).push(v)}
  for(const k in m)m[k].sort((a,b)=>(a.ts||0)-(b.ts||0));
  return m;
}
function allDoctorRows(){
  const out=[];
  const seen=new Set();
  for(const e of master.executives)for(const d of (e.doctors||[])){
    if(seen.has(d.id))continue; seen.add(d.id);
    const o=assign[d.id]; out.push({exec:(o&&execById(o.execId))||e,doc:mergeInfo(d),orig:e});
  }
  return out;
}

/* ---------- capability boot ---------- */
async function boot(){
  render();
  if(!window.claude||!claude.use){offlineNote="Saving is unavailable in this view. Open the page from claude.ai to log visits.";render();return}
  [db,user,downloads,sample]=await Promise.all(["db","user","downloads","sample"].map(n=>claude.use(n).catch(()=>null)));
  if(user){
    try{realAdmin=!!(await user.isOwner())}catch(e){}
    try{const w=await user.can("data.write");if(w===false)baseWrite=false}catch(e){}
  }
  if(!db){offlineNote="The shared database isn't reachable in this view. Sign in on claude.ai to log and see visits.";masterLoaded=visitsLoaded=true;render();return}
  let timer=setTimeout(()=>{offlineNote="Data can't be reached yet — check your connection. What you see may be out of date.";render()},10000);
  const clear=()=>{if(timer){clearTimeout(timer);timer=null;offlineNote="";}};
  db.doc("config/master").onSnapshot(s=>{
    master = s.exists ? {executives:[],...s.data()} : {executives:[]};
    masterLoaded=true; if(!s.metadata.fromCache)clear(); if(!myTheme())applyTheme(master.theme||"classic"); fixMe(); render();
  },e=>{clear();offlineNote="Couldn't load the team list ("+e.code+").";masterLoaded=true;render()});
  try{uid=user?await user.id():null}catch(e){uid=null}
  db.collection("plans").orderBy("date","desc").limit(1000).onSnapshot(s=>{plans=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
  db.collection("assign").onSnapshot(s=>{const a={};s.docs.forEach(d=>a[d.id]=d.data());assign=a;render()},()=>{});
  db.collection("transfers").orderBy("at","desc").limit(500).onSnapshot(s=>{transfers=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
  const onErr=e=>{clear();offlineNote="Couldn't load visits ("+e.code+").";visitsLoaded=true;render()};
  if(realAdmin&&uid){

function openFollowups(bd){
  const out=[];
  for(const {exec,doc} of allDoctorRows()){
    const hs=bd[key(exec.id,doc.id)]||[]; const l=hs[hs.length-1];
    for(const p of plans)if(p.doctorId===doc.id&&!p.done)out.push({exec,doc,last:l,hist:hs,next:p.date,time:p.time||"",type:"planned",note:p.note||"",plan:p});
    if(l&&(l.status==="followup"||l.status==="positive")&&nextDate(l))out.push({exec,doc,last:l,hist:hs,next:nextDate(l),time:l.nextTime||"",type:l.status,note:l.reason||l.conversation||""});
  }
  return out.sort((a,b)=>((a.next||"9")+a.time).localeCompare((b.next||"9")+b.time));
}

/* ---- Briefings ---- */
function briefingsFor(date,bd){
  const seen=new Set(), out=[];
  for(const r of openFollowups(bd)){
    if(r.next!==date)continue; const k=key(r.exec.id,r.doc.id); if(seen.has(k))continue; seen.add(k);
    out.push({...r,last:r.last||null});
  }
  return out;
}
function ruleTips(l,hist,doc){
  const tips=[]; const txt=((l.reason||"")+" "+(l.conversation||"")).toLowerCase(); const role=l.role||doc.role;
  if(/price|cost|rate|discount|expens|budget|quote|quotation/.test(txt))tips.push("Lead with value, not price: total cost of ownership, warranty and service response time. Bring a revised quotation or payment-term option.");
  if(/existing|current vendor|already|competit|other company|using/.test(txt))tips.push("Show 2–3 clear advantages over their current supplier (service, uptime, local stock in Chennai) and offer a side-by-side trial.");
  if(/demo|trial|sample|see|check/.test(txt))tips.push("Confirm the demo/trial slot and carry the unit or samples — make it hands-on.");
  if(/approv|management|committee|md|admin|purchase dept|board/.test(txt))tips.push("Ask who else signs off and offer to present to the purchase committee; bring a one-page proposal they can forward.");
  if(/stock|delivery|urgent|time/.test(txt))tips.push("Confirm stock availability and give a firm delivery date.");
  if(role==="referral")tips.push("This doctor refers but doesn't buy — ask for an introduction to the purchase decision-maker.");
  if(role==="purchase")tips.push("Doctor is on the purchase side — aim for a clear commitment (PO date / order quantity) before leaving.");
  if(l.status==="positive")tips.push("Doctor was positive last time — thank them, recap agreed points and ask for the confirmation / PO.");
  if(hist.length>=4)tips.push(`This is meeting #${hist.length+1}. Avoid repeating the pitch — address the one open objection and ask directly for a decision.`);
  if(!tips.length)tips.push("Recap what the doctor said last time, answer their open question, and agree a concrete next step before leaving.");
  return tips.slice(0,4);
}
function briefMsg(r){
  const d=r.doc, l=r.last, when=r.next===addDays(today(),1)?"tomorrow":fmtD(r.next);
  const head=`*Dr. Han Healthcare – ${l?"Meeting Briefing":"New Doctor Meeting"}*
Hi ${r.exec.name}, you have a meeting ${when}:

👨‍⚕️ *${d.doctor}*${d.speciality?" ("+d.speciality+")":""}
🏥 ${d.hospital}
📍 ${d.area||"-"}
📅 ${fmtD(r.next)}${r.time?" · ⏰ "+t12(r.time):""}
📞 ${d.phone||"-"}
🛒 ${ROLE_LONG[(l&&l.role)||d.role]||"-"}`;
  if(!l){
    return head+`${r.note?"\n📝 "+r.note:""}

*First meeting* – introduce Dr. Han Healthcare and our product range, understand the doctor's needs, and note who handles purchase.

All the best! 👍`;
  }
  const kp=(l.keyPoints&&l.keyPoints.length?l.keyPoints:ruleTips(l,r.hist,d));
  return head+`${r.note&&r.type==="planned"?"\n📝 "+r.note:""}

*Last meetup – ${fmtD(l.date)}, ${t12(l.time)} (meetup #${r.hist.length})*
Purpose: ${(l.purposes||[]).join(", ")||"-"}

*Meetup history*
${r.hist.map((v,i)=>`${i+1}) ${fmtDs(v.date)} – ${STATUS[v.status]}`).join("\n")}

*Key points to convince*
${kp.map(k=>"• "+k).join("\n")}

All the best! 👍`;
}

function roleFrom(s){s=String(s||"").toLowerCase();if(s.includes("ref"))return "referral";if(s.includes("no"))return "nopurchase";if(s.includes("purch")||s==="yes")return "purchase";return ""}
function normId(s){return String(s||"").trim().toUpperCase().replace(/[^A-Z0-9_-]/g,"")}
function gv(r,...keys){for(const k of keys){const f=Object.keys(r).find(c=>c.trim().toLowerCase()===k);if(f&&String(r[f]).trim()!=="")return String(r[f]).trim()}return ""}
function findSheet(wb,words){const n=wb.SheetNames.find(n=>words.some(w=>n.toLowerCase().includes(w)));return n?XLSX.utils.sheet_to_json(wb.Sheets[n],{defval:"",raw:false}):null}
function applyRows(exRows,docRows,replace){
  const ex=replace?[]:JSON.parse(JSON.stringify(master.executives));
  const pw={}, problems=[]; let nE=0,nD=0;
  (exRows||[]).forEach((r,i)=>{
    const id=normId(gv(r,"executive id","employee id","emp id","id")), name=gv(r,"executive name","name","executive");
    if(!id&&!name)return;
    if(!id||!name){problems.push(`Executives row ${i+2}: Executive ID and Executive Name are both required.`);return}
    let e=ex.find(z=>z.id===id); if(!e){e={id,name,phone:"",doctors:[]};ex.push(e);nE++}
    e.name=name; const ph=gv(r,"whatsapp number","whatsapp","executive whatsapp","mobile","phone"); if(ph)e.phone=ph;
    pw[id]=gv(r,"default password","password")||String(e.phone||"").replace(/\D/g,"").slice(-10);
    if(!pw[id])problems.push(`${id}: no Default Password or WhatsApp number — set a default password in Setup.`);
  });
  (docRows||[]).forEach((r,i)=>{
    const id=normId(gv(r,"executive id","employee id","emp id","id")), en=gv(r,"executive name","executive");
    const dn=gv(r,"doctor name","doctor"), hn=gv(r,"hospital / clinic","hospital","hospital name","clinic");
    if(!dn&&!hn)return;
    if(!dn||!hn){problems.push(`Doctor row ${i+2}: Doctor Name and Hospital are required.`);return}
    const e=id?ex.find(z=>z.id===id):ex.find(z=>z.name.toLowerCase()===en.toLowerCase());
    if(!e){problems.push(`Doctor row ${i+2} (${dn}): Executive ID "${id||en}" is not in the Executives sheet.`);return}
    const did=slug(dn+"-"+hn);
    const d={id:did,doctor:dn,hospital:hn,area:gv(r,"area","location"),address:gv(r,"address","doctor address","hospital address"),zone:zoneFrom(gv(r,"zone","chennai zone")),speciality:gv(r,"speciality","specialty"),phone:gv(r,"doctor phone"),role:roleFrom(gv(r,"purchase role","role"))};
    if(!d.zone)delete d.zone; if(!d.address)delete d.address;
    if(!d.role)problems.push(`Doctor row ${i+2} (${dn}): Purchase Role should be Purchase / No Purchase / Referral Only.`);
    const k=e.doctors.findIndex(z=>z.id===did); if(k>=0)e.doctors[k]={...e.doctors[k],...d}; else {e.doctors.push(d);nD++}
  });
  return {ex,pw,problems,nE,nD};
}

function hex(b){return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function newSalt(){return hex(crypto.getRandomValues(new Uint8Array(16)))}
async function hashPw(pw,salt){
  const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  return hex(await crypto.subtle.deriveBits({name:"PBKDF2",salt:new TextEncoder().encode(salt),iterations:150000,hash:"SHA-256"},k,256));
}

async function verifyAdminPw(p){return !!adminDoc&&await hashPw(p,adminDoc.pwSalt)===adminDoc.pwHash}
async function resetData(full,progress){
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const list=async c=>{try{return (await db.collection(c).limit(1000).get()).docs.map(d=>c+"/"+d.id)}catch(e){return []}};
  let total=0;
  for(let pass=0;pass<6;pass++){
    progress("Finding data…");
    const paths=[];
    const vParents=await list("visits"); const vIds=new Set(vParents.map(p=>p.split("/")[1])); if(uid)vIds.add(uid);
    for(const id of vIds)paths.push(...await list("visits/"+id+"/v"));
    paths.push(...vParents);
    const aParents=await list("activity"); const aIds=new Set(aParents.map(p=>p.split("/")[1])); if(uid)aIds.add(uid);
    for(const id of aIds)paths.push(...await list("activity/"+id+"/d"));
    paths.push(...aParents);
    const oParents=await list("orders"); const oIds=new Set(oParents.map(p=>p.split("/")[1])); if(uid)oIds.add(uid);
    for(const id of oIds)paths.push(...await list("orders/"+id+"/o"));
    paths.push(...oParents);
    for(const c of ["plans","assign","transfers","claims","docinfo"])paths.push(...await list(c));
    if(full){paths.push(...await list("auth"));if(pass===0)paths.push("public/names");if(master.executives.length||master.theme)paths.push("config/master")}
    const todo=paths.filter(p=>!(p==="config/master"&&pass>0));
    if(!todo.length)break;
    for(let i=0;i<todo.length;i++){
      for(let a=0;a<5;a++){
        try{await db.doc(todo[i]).delete();break}
        catch(e){if((e.code==="resource_exhausted"||e.code==="unavailable")&&a<4){await sleep(700*(a+1))}else throw e}
      }
      total++; if(i%5===0||i===todo.length-1)progress(`Erasing… ${i+1} of ${todo.length}`);
    }
    if(todo.length<50)break;
  }
  progress("Done"); return total;
}

/* =========================================================
   ORDERS – from doctor's estimate to payment collected
   Stored per executive: orders/<account>/o/<id>
   ========================================================= */
const STAGES=[["estimate","Interested · estimate"],["quote","Quotation sent"],["signed","Quotation signed"],["po","Order / PO received"],["delivered","Delivered"],["paid","Payment collected"]];
const STAGE_LBL=Object.assign(Object.fromEntries(STAGES),{lost:"Lost / cancelled"});
const STAGE_IDX=Object.fromEntries(STAGES.map(([k],i)=>[k,i]));
const WON=new Set(["signed","po","delivered","paid"]), OPEN=new Set(["estimate","quote"]);
const STAGE_CLR={estimate:"#5f6f80",quote:"#2563a8",signed:"#7a4fb5",po:"#c9850b",delivered:"#0e7490",paid:"#1f9d6f",lost:"#d64545"};
const PAY_TERMS=["Advance","On delivery","30 days credit","60 days credit","90 days credit","Other"];
const LOST_WHY=["Price too high","Went with competitor","Budget not approved","Doctor changed mind","Product not suitable","Other"];
let orders=[], ordersBy={}, oSubs={}, oParentDone=false, oForm=null;
function watchOrders(id){
  if(oSubs[id])return; oSubs[id]=db.collection("orders/"+id+"/o").orderBy("created","desc").limit(1000).onSnapshot(s=>{
    ordersBy[id]=s.docs.map(d=>({id:d.id,_uid:id,...d.data()})); orders=[].concat(...Object.values(ordersBy)); render();
  },()=>{});
}
function inr(n){n=Math.round(+n||0);return "₹"+n.toLocaleString("en-IN")}
function oVal(o){return +o.finalAmount||+o.quoteAmount||+o.estAmount||0}
function oItemsTotal(items){return (items||[]).reduce((a,i)=>a+(+i.qty||0)*(+i.price||0),0)}
function stageChip(s){return `<span class="chip" style="background:${STAGE_CLR[s]}1c;color:${STAGE_CLR[s]}">${esc(STAGE_LBL[s]||s)}</span>`}
function stageDots(s){if(s==="lost")return "";const k=STAGE_IDX[s]??0;return `<div style="display:flex;gap:3px;margin-top:8px">${STAGES.map((_,i)=>`<i style="flex:1;height:5px;border-radius:3px;background:${i<=k?STAGE_CLR[s]:"var(--line)"}"></i>`).join("")}</div>`}
function oInPeriod(o){
  const d=ymd(new Date(o.created||Date.now())), t=today(), p=filt.oPeriod;
  if(p==="month")return d.slice(0,7)===t.slice(0,7);
  if(p==="last"){const x=new Date();x.setDate(1);x.setMonth(x.getMonth()-1);return d.slice(0,7)===ymd(x).slice(0,7)}
  if(p==="year")return d.slice(0,4)===t.slice(0,4);
  return true;
}
function orderStats(list){
  const sum=(f,arr)=>arr.reduce((a,o)=>a+f(o),0);
  const open=list.filter(o=>OPEN.has(o.stage)), won=list.filter(o=>WON.has(o.stage));
  const collected=sum(o=>+o.paid||0,list.filter(o=>o.stage!=="lost"));
  return {n:list.length,open:open.length,openVal:sum(oVal,open),won:won.length,wonVal:sum(oVal,won),
    delivered:list.filter(o=>o.stage==="delivered"||o.stage==="paid").length,collected,pending:Math.max(0,sum(oVal,won)-collected),lost:list.filter(o=>o.stage==="lost").length};
}

  }
  if(!shown.length)return h+`<div class="empty">No orders here yet.${canWrite&&!canAdmin?"<br><br>When a doctor is positive, tap <b>+ New order</b> to record the estimate.":""}</div>`;
  h+=`<div class="grid">`+shown.map(o=>`<div class="card doc" data-ord="${esc(o._uid)}|${esc(o.id)}">
      <div class="row" style="align-items:flex-start"><div class="grow"><div class="t">${esc(o.doctor)}</div><div class="h">${esc(o.hospital)}${o.area?" · "+esc(o.area):""}</div></div>

      ${canAdmin?`<div class="small" style="margin-top:4px;color:var(--navy)">👤 ${esc(o.execName||"")}</div>`:""}
      <div class="m">${stageChip(o.stage)}${o.quoteNo?`<span>Quote ${esc(o.quoteNo)}</span>`:""}${o.poNo?`<span>PO ${esc(o.poNo)}</span>`:""}${o.expDelivery&&!["delivered","paid","lost"].includes(o.stage)?`<span class="chip ${o.expDelivery<today()?"due":""}">🚚 ${fmtDs(o.expDelivery)}</span>`:""}</div>
      ${stageDots(o.stage)}</div>`).join("")+`</div>`;
  return h;
}

    signedDate:val("ofSDt"),poNo:val("ofPo"),poDate:val("ofPoDt"),finalAmount:num("ofFin"),expDelivery:val("ofExp"),deliveredDate:val("ofDel"),
    paid:num("ofPaid"),payTerms:F.payTerms,lostWhy:F.lostWhy,notes:val("ofNotes"),stage:s,updated:Date.now()};
  if(!rec.title&&!items.length&&!rec.estAmount)return err.textContent="Add a title, a product, or the doctor's estimated amount.";
  if(k>=2&&!rec.signedDate)return err.textContent="Enter the date the quotation was signed.";
  if(k>=3&&!rec.poNo)return err.textContent="Enter the PO / order number.";
  if(k>=3&&!rec.finalAmount)rec.finalAmount=rec.quoteAmount;
  if(k>=4&&!rec.deliveredDate)return err.textContent="Enter the delivery date.";
  if(s==="paid"&&!rec.paid)rec.paid=rec.finalAmount||rec.quoteAmount;
  if(s==="lost"&&!rec.lostWhy)return err.textContent="Choose why the order was lost.";
  const a=actor(), changed=!F.o||F.o.stage!==s;
  rec.history=[...((F.o&&F.o.history)||[]),...(changed?[{stage:s,at:Date.now(),by:a.id,byName:a.name}]:[])];
  const btn=$("#ofGo"); btn.disabled=true; btn.textContent="Saving…";
  try{
    if(F.o){await db.doc("orders/"+F.o._uid+"/o/"+F.o.id).set({...rec,created:F.o.created||Date.now()})}
    else{
      const folder=(canAdmin&&(accounts.find(a=>a.execId===F.e.id)||{}).uid)||uid;
      await db.doc("orders/"+folder).set({execId:folder===uid&&canAdmin?"ADMIN":F.e.id,updated:Date.now()});
      await db.collection("orders/"+folder+"/o").add({...rec,created:Date.now()});
    }
    logAct("order",`${rec.doctor} (${rec.hospital}) – ${STAGE_LBL[s]} – ${inr(oVal(rec))}${rec.title?" – "+rec.title:""}${s==="lost"?" – "+rec.lostWhy:""}`);
    $("#ov").classList.remove("on"); docOpen=false; oForm=null;
    toast(s==="lost"?"Order marked lost":WON.has(s)?"Order saved ✓ 🎉":"Order saved ✓");
    if(view!=="orders"){location.hash="orders"}else render();
  }catch(x){btn.disabled=false;btn.textContent="Save order";err.textContent=x.code==="invalid_argument"?"You don't have permission to save this order.":"Couldn't save ("+(x.code||x.message)+")"}
}
function orderAfterPositive(rec){
  const open=orders.find(o=>o.doctorId===rec.doctorId&&!["paid","lost"].includes(o.stage));
  const msg="🎉 Doctor is positive! Record the expected order now — at least the doctor's estimated amount.";
  if(open)openOrder(open,null,"🎉 Doctor is positive! Update this order's stage or amount.");
  else openOrder(null,rec.doctorId,msg);
}
function exportOrders(){
  let list=orders.filter(oInPeriod); if(filt.oExec!=="all")list=list.filter(o=>o.execId===filt.oExec);
  if(!list.length)return toast("No orders to export");
  if(!window.XLSX)return toast("Excel library didn't load");
  const rows=list.sort((a,b)=>(a.created||0)-(b.created||0)).map(o=>({"Created":ymd(new Date(o.created||0)),"Executive":o.execName,"Executive ID":o.execId,"Doctor":o.doctor,"Hospital":o.hospital,"Area":o.area||"",
    "Order title":o.title||"","Products":(o.items||[]).map(i=>`${i.name} x${i.qty} @ ${i.price}`).join("; "),"Stage":STAGE_LBL[o.stage],
    "Doctor estimate (₹)":o.estAmount||"","Quoted (₹)":o.quoteAmount||"","Final order value (₹)":o.finalAmount||"","Received (₹)":o.paid||"",
    "Quotation no.":o.quoteNo||"","Quotation date":o.quoteDate||"","Signed on":o.signedDate||"","PO no.":o.poNo||"","PO date":o.poDate||"",
    "Expected delivery":o.expDelivery||"","Delivered on":o.deliveredDate||"","Payment terms":o.payTerms||"","Lost reason":o.lostWhy||"","Notes":o.notes||""}));
  const wb=XLSX.utils.book_new(), ws=XLSX.utils.json_to_sheet(rows);
  ws["!cols"]=Object.keys(rows[0]).map(k=>({wch:Math.max(10,Math.min(40,k.length+4))}));
  XLSX.utils.book_append_sheet(wb,ws,"Orders");
  save(`HAN_Orders_${today()}.xlsx`,new Blob([XLSX.write(wb,{bookType:"xlsx",type:"array"})]));
}

function doctorOrdersHtml(d){
  const os=orders.filter(o=>o.doctorId===d.id);
  return `${canWrite&&db?`<button class="btn" id="ordNew" style="width:100%;justify-content:center;margin-top:10px">💰 New order / quotation</button>`:""}`+
    (os.length?`<span class="lbl">Orders (${os.length})</span>`+os.map(o=>`<div class="card doc" data-dord="${esc(o._uid)}|${esc(o.id)}" style="padding:10px 12px;margin-bottom:6px"><div class="row"><b class="grow">${esc(o.title||"Order")}</b><b>${inr(oVal(o))}</b></div><div class="m" style="margin-top:4px">${stageChip(o.stage)}${o.paid?`<span>paid ${inr(o.paid)}</span>`:""}</div></div>`).join(""):"");
}
function bindDoctorOrders(d){
  const n=$("#ordNew"); if(n)n.onclick=()=>openOrder(null,d.id);
  document.querySelectorAll("[data-dord]").forEach(c=>c.onclick=()=>{const [u,id]=c.dataset.dord.split("|");const x=orders.find(z=>z._uid===u&&z.id===id);if(x)openOrder(x)});
}

/* ---------- doctor info edits (by executives) ---------- */
const INFO_FIELDS=[["phone","Doctor phone","tel","e.g. 9876543210"],["speciality","Speciality","text","e.g. Cardiology"],["area","Area / location","text","e.g. Velachery"],
  ["address","Full address","text","Door no, street, area, Chennai"],["email","Email","email","doctor@example.com"],["timings","Clinic timings","text","e.g. Mon–Sat 10am–1pm, 5–8pm"],
  ["bestTime","Best time to visit","text","e.g. After 6 pm, avoid Mondays"],["docNotes","Notes about the doctor","text","Assistant's name, preferences, etc."]];
let infoMap={}, extraStarted=false;
function mergeInfo(d){const i=infoMap[d.id];if(!i)return d;const r={...d,_info:i};for(const [k] of INFO_FIELDS)if(i[k]!==undefined&&String(i[k]).trim()!=="")r[k]=i[k];return r}
function infoMissing(d){const m=[];if(!String(d.phone||"").trim())m.push("phone");if(!String(d.area||"").trim()&&!String(d.address||"").trim())m.push("address");if(!String(d.speciality||"").trim())m.push("speciality");return m}
function ensureExtraSubs(){
  if(extraStarted||!db||!uid||!loggedIn())return; extraStarted=true;
  db.collection("docinfo").onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());infoMap=m;render()},()=>{});
  watchOrders(uid); if(canAdmin)db.collection("orders").onSnapshot(s=>{s.docs.forEach(d=>watchOrders(d.id))},()=>{});
}
function openDocInfo(execId,docId){
  const row=allDoctorRows().find(r=>r.doc.id===docId); if(!row)return; const d=row.doc;
  $("#sheet").innerHTML=`<div class="sheet-h"><div><div style="font-weight:700;font-size:16px">✏️ Edit doctor info</div><div class="small" style="color:#b9cbdd">${esc(d.doctor)} · ${esc(d.hospital)}</div></div><button class="x" id="diX">×</button></div>
  <div class="sheet-b">
    <p class="small muted" style="margin-top:0">Update or fill in missing details. Doctor name and hospital can only be changed by the admin.</p>
    ${INFO_FIELDS.map(([k,l,t,ph])=>`<span class="lbl">${l}</span><input type="${t==="tel"?"tel":"text"}" ${t==="tel"?'inputmode="tel"':""} id="di_${k}" value="${esc(d[k]||"")}" placeholder="${esc(ph)}">`).join("")}
    <div class="err" id="diErr"></div>
    <div class="row" style="justify-content:flex-end;margin-top:14px">${canAdmin&&d._info?`<button class="btn" id="diReset" style="margin-right:auto">Reset to Excel data</button>`:""}<button class="btn" id="diC">Cancel</button><button class="btn pri" id="diGo">Save</button></div>
  </div>`;
  $("#ov").classList.add("on"); docOpen=true;
  const back=()=>openDoctor(execId,docId);
  $("#diX").onclick=$("#diC").onclick=back;
  const rs=$("#diReset"); if(rs)rs.onclick=async()=>{try{await db.doc("docinfo/"+docId).delete();logAct("doctor",`Reset ${d.doctor}'s info to the Excel data`);toast("Reset to Excel data");setTimeout(back,300)}catch(e){toast("Couldn't reset")}};
  $("#diGo").onclick=async()=>{
    const v={}, changed=[];
    for(const [k,l] of INFO_FIELDS){v[k]=$("#di_"+k).value.trim();if(v[k]!==String(d[k]||"").trim())changed.push(l)}
    if(v.phone&&v.phone.replace(/\D/g,"").length<8)return $("#diErr").textContent="Check the phone number.";
    if(!changed.length)return back();
    const a=actor(), btn=$("#diGo"); btn.disabled=true; btn.textContent="Saving…";
    try{
      await db.doc("docinfo/"+docId).set({...(infoMap[docId]||{}),...v,doctor:d.doctor,hospital:d.hospital,by:a.id,byName:a.name,at:Date.now()});
      infoMap[docId]={...(infoMap[docId]||{}),...v,by:a.id,byName:a.name,at:Date.now()};
      logAct("doctor",`Updated ${d.doctor} (${d.hospital}): ${changed.join(", ")}`);
      toast("Doctor info saved ✓"); back();
    }catch(x){btn.disabled=false;btn.textContent="Save";$("#diErr").textContent=x.code==="invalid_argument"?"You don't have permission to edit this doctor.":"Couldn't save ("+(x.code||x.message)+")"}
  };
}
function docInfoExtraHtml(d){
  const ex=[["email","Email"],["timings","Clinic timings"],["bestTime","Best time to visit"],["docNotes","Notes"]].filter(([k])=>d[k]);
  const miss=infoMissing(d);
  return (ex.length?`<div class="auto" style="margin-top:-6px">${ex.map(([k,l])=>`<div>${l}<b style="font-weight:500">${esc(d[k])}</b></div>`).join("")}</div>`:"")+
    `<div class="row" style="margin:-6px 0 14px">${miss.length?`<span class="chip fu">⚠️ Missing: ${miss.join(", ")}</span>`:""}
     ${d._info?`<span class="small muted">Info updated by ${esc(d._info.byName||d._info.by||"")} · ${esc(fmtDs(ymd(new Date(d._info.at||Date.now()))))}</span>`:""}
     <div class="grow"></div>${canWrite&&db?`<button class="btn sm" id="diOpen">✏️ Edit doctor info</button>`:""}</div>`;
}

/* ---------- confirm box ---------- */
function confirmBox(text,yes,label){
  $("#sheet").innerHTML=`<div class="sheet-b"><p style="margin-top:4px">${esc(text)}</p><div class="row" style="justify-content:flex-end"><button class="btn" id="cn">Cancel</button><button class="btn pri" id="cy" style="background:var(--red);border-color:var(--red)">${esc(label||"Remove")}</button></div></div>`;
  $("#ov").classList.add("on");
  $("#cn").onclick=()=>$("#ov").classList.remove("on");
  $("#cy").onclick=()=>{$("#ov").classList.remove("on");yes()};
}
